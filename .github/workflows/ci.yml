name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Build deployable dist
        run: BUILD_VERSION="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: fbads-dist
          path: dist
