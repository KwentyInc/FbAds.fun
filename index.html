<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParserAccs — Facebook Ads parser bookmarklet</title>
<meta name="description" content="Bookmarklet for bulk parsing of Facebook Ads Manager accounts and bulk account reporting, automated-rules transfer and experimental campaign cloning: spend, limits, billing, ad status, BM mapping, CSV, AutoRules and CloneAds.">
<meta name="theme-color" content="#0b0d11">
<style>
  :root{
    --bg0:#0b0d11; --bg1:#141519; --bg2:#1a1c21; --line:#23262e;
    --txt:#e8eaef; --mut:#9aa0ab; --teal:#2dd4bf; --blue:#3b8cff;
    --violet:#a78bfa; --amber:#f5b13d; --green:#37d67a; --red:#ff5d6c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'SF Pro Text','Segoe UI',system-ui,-apple-system,sans-serif;
    background:var(--bg0); color:var(--txt); line-height:1.6;
    overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }
  #bg-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 22px}
  [data-i18n],[data-i18n-html]{transition:opacity .25s ease}
  .i18n-fade{opacity:0}

  header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:20px 0}
  .logo{font-family:'Space Grotesk','SF Pro Display',system-ui,sans-serif;font-weight:800;font-size:18px;letter-spacing:.4px;
    background:linear-gradient(92deg,#fff,#2dd4bf 60%,#3b8cff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .h-right{display:flex;align-items:center;gap:12px}
  .gh{display:inline-flex;align-items:center;gap:7px;color:var(--mut);text-decoration:none;font-size:13px;font-weight:600;
    border:1px solid var(--line);border-radius:20px;padding:7px 14px;transition:.18s}
  .gh:hover{color:var(--teal);border-color:var(--teal);transform:translateY(-1px)}

  .langsw{position:relative;display:inline-flex;align-items:center;background:var(--bg2);border:1px solid var(--line);
    border-radius:20px;padding:3px;cursor:pointer;user-select:none;font-family:ui-monospace,monospace}
  .langsw .opt{position:relative;z-index:2;font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--mut);
    padding:5px 12px;border-radius:16px;transition:color .2s}
  .langsw .opt.on{color:#06120f}
  .langsw .knob{position:absolute;z-index:1;top:3px;left:3px;height:calc(100% - 6px);width:calc(50% - 3px);
    border-radius:16px;background:linear-gradient(135deg,#2dd4bf,#3b8cff);box-shadow:0 2px 10px rgba(45,212,191,.35);
    transition:transform .26s cubic-bezier(.34,1.4,.5,1)}
  .langsw.en .knob{transform:translateX(100%)}

  .hero{text-align:center;padding:46px 0 30px}
  .hero h1{font-family:'Space Grotesk','SF Pro Display',system-ui,sans-serif;font-weight:800;letter-spacing:.5px;
    font-size:clamp(38px,7vw,72px);line-height:1.02;
    background:linear-gradient(92deg,#ffffff 0%,#2dd4bf 42%,#3b8cff 70%,#ffffff 100%);background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:tshift 7s linear infinite,tglow 3.6s ease-in-out infinite}
  @keyframes tshift{0%{background-position:0% 50%}100%{background-position:220% 50%}}
  @keyframes tglow{0%,100%{filter:drop-shadow(0 0 0 rgba(45,212,191,0))}50%{filter:drop-shadow(0 0 26px rgba(45,212,191,.35))}}
  .hero p.lead{max-width:680px;margin:18px auto 0;color:var(--mut);font-size:clamp(15px,2.2vw,18px)}
  .tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
  .tag{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--teal);background:rgba(45,212,191,.1);
    border:1px solid rgba(45,212,191,.3);border-radius:20px;padding:5px 12px}

  .install{margin:38px auto 0;max-width:760px;text-align:center;
    background:linear-gradient(180deg,rgba(26,28,33,.7),rgba(20,21,25,.5));
    border:1px solid var(--line);border-radius:20px;padding:34px 26px;position:relative;overflow:hidden}
  .install::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(60% 80% at 50% -10%,rgba(45,212,191,.12),transparent 60%)}
  .hint-bar{font-size:12px;color:var(--mut);margin-bottom:22px}
  .hint-bar b{color:var(--txt)}
  .hint-bar kbd{font-family:ui-monospace,monospace;background:var(--bg2);border:1px solid var(--line);
    border-radius:5px;padding:1px 7px;font-size:11px;color:var(--teal)}

  .bm-btn{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:grab;user-select:none;
    font-family:'Space Grotesk',system-ui,sans-serif;font-weight:800;font-size:20px;letter-spacing:.3px;color:#06120f;
    background:linear-gradient(135deg,#2dd4bf,#3b8cff);border:none;border-radius:16px;padding:18px 38px;text-decoration:none;
    box-shadow:0 10px 34px rgba(45,212,191,.32),0 0 0 1px rgba(255,255,255,.12) inset;transition:transform .15s,box-shadow .2s}
  .bm-btn:hover{transform:translateY(-3px);box-shadow:0 16px 44px rgba(45,212,191,.45)}
  .bm-btn:active{cursor:grabbing;transform:translateY(-1px)}
  .bm-btn.loading{filter:grayscale(.4) brightness(.8);cursor:wait}
  .bm-btn::after{content:"";position:absolute;inset:0;border-radius:16px;pointer-events:none;
    box-shadow:0 0 0 0 rgba(45,212,191,.5);animation:ring 2.2s infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(45,212,191,.45)}70%{box-shadow:0 0 0 16px rgba(45,212,191,0)}100%{box-shadow:0 0 0 0 rgba(45,212,191,0)}}
  .drag-hint{margin-top:16px;font-size:13px;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:8px}
  .drag-hint .arrow{font-size:18px;color:var(--teal);animation:bob 1.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .lang-note{margin-top:10px;font-size:11px;color:var(--mut)}
  .lang-note b{color:var(--teal)}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px;align-items:center}
  .copy-btn{font-family:inherit;font-weight:700;font-size:13px;color:var(--txt);cursor:pointer;
    background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 20px;transition:.15s}
  .copy-btn:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-1px)}
  .copy-btn.ok{background:var(--green);color:#06120f;border-color:var(--green)}
  .rebuild-btn{font-family:inherit;font-weight:700;font-size:13px;color:var(--txt);cursor:pointer;
    background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:11px 20px;transition:.15s}
  .rebuild-btn:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-1px)}
  .rebuild-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  #build-status{font-family:ui-monospace,monospace;font-size:12px;color:var(--mut);min-height:18px;line-height:18px}
  #build-status.ready{color:var(--green)}
  #build-status.error{color:var(--red)}
  #build-status.loading{color:var(--amber)}
  #build-version{font-family:ui-monospace,monospace;font-size:11px;color:var(--mut);opacity:.7}
  .warn{display:none;margin-top:18px;font-size:12px;color:var(--amber);background:rgba(245,177,61,.08);
    border:1px solid rgba(245,177,61,.3);border-radius:10px;padding:10px 14px;line-height:1.6;text-align:left}
  .warn a{color:var(--teal);font-weight:700}
  .warn code{font-family:ui-monospace,monospace;background:rgba(0,0,0,.3);padding:1px 5px;border-radius:4px}

  section.block{padding:60px 0 10px}
  .sec-title{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:800;font-size:clamp(24px,4vw,34px);
    text-align:center;letter-spacing:.3px}
  .sec-sub{text-align:center;color:var(--mut);margin-top:8px;font-size:14px}

  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:34px}
  .step{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:22px;position:relative;transition:.2s}
  .step:hover{border-color:rgba(45,212,191,.4);transform:translateY(-3px)}
  .step .n{position:absolute;top:-14px;left:18px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    font-weight:800;font-size:14px;color:#06120f;background:linear-gradient(135deg,#2dd4bf,#3b8cff)}
  .step h3{font-size:15px;margin:6px 0 8px}
  .step p{font-size:13px;color:var(--mut)}
  .step kbd{font-family:ui-monospace,monospace;background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--teal)}

  .feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:34px}
  .feat{background:var(--bg1);border:1px solid var(--line);border-radius:14px;padding:22px;transition:.2s}
  .feat:hover{border-color:rgba(45,212,191,.4);transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .feat .ic{font-size:26px;margin-bottom:10px}
  .feat h3{font-size:15px;margin-bottom:6px}
  .feat p{font-size:13px;color:var(--mut)}
  .feat.rules{border-color:rgba(167,139,250,.3)}
  .feat.rules:hover{border-color:rgba(167,139,250,.55);box-shadow:0 10px 30px rgba(167,139,250,.12)}
  .feat.clone{border-color:rgba(59,140,255,.32)}
  .feat.clone:hover{border-color:rgba(59,140,255,.62);box-shadow:0 10px 30px rgba(59,140,255,.12)}
  .beta-note{max-width:820px;margin:22px auto 0;padding:12px 16px;border:1px solid rgba(245,177,61,.28);border-radius:12px;background:rgba(245,177,61,.07);color:var(--mut);font-size:12px;line-height:1.6;text-align:center}
  .beta-note b{color:var(--amber)}

  .shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:34px}
  .shot{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg1);transition:.2s}
  .shot:hover{border-color:rgba(45,212,191,.4);transform:translateY(-3px);box-shadow:0 14px 40px rgba(0,0,0,.4)}
  .shot a{display:block}
  .shot img{width:100%;display:block}
  .shot .cap{padding:10px 14px;font-size:12px;color:var(--mut)}

  /* ===== DONATE ===== */
  .donate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:18px;margin-top:34px}
  .donate-card{display:flex;gap:16px;align-items:flex-start;background:var(--bg1);border:1px solid var(--line);
    border-radius:16px;padding:20px;transition:.2s;position:relative;overflow:hidden}
  .donate-card::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(75% 95% at 100% 0%,rgba(45,212,191,.09),transparent 60%)}
  .donate-card:hover{border-color:rgba(45,212,191,.45);transform:translateY(-3px);box-shadow:0 12px 34px rgba(0,0,0,.38)}
  .donate-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
  .donate-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.donate-ic{width:34px;height:34px;flex:0 0 auto;border-radius:50%;object-fit:cover;display:block;
    box-shadow:0 0 0 1px rgba(255,255,255,.10) inset,0 0 0 1px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.45);
    transition:transform .18s}
  .donate-card:hover .donate-ic{transform:scale(1.08)}
  .donate-qr-wrap{position:relative}
  .donate-qr{cursor:zoom-in;transition:transform .25s cubic-bezier(.4,0,.2,1),box-shadow .25s;transform-origin:center}
  .donate-qr:hover{transform:scale(1.15);box-shadow:0 0 0 2px rgba(45,212,191,.4)}
  .pa-qr-lb{position:fixed;inset:0;z-index:1000006;background:rgba(6,8,12,.86);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;cursor:zoom-out;animation:pa-qr-in .18s ease}
  .pa-qr-lb img{width:min(78vmin,520px);height:auto;border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.14)}
  .shot a{cursor:zoom-in}
  .pa-qr-lb.pa-shot-lb img{width:auto;max-width:94vw;max-height:90vh;border-radius:12px}
  @media (max-width:900px){.feats{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:560px){.feats{grid-template-columns:minmax(0,1fr)}}
  @keyframes pa-qr-in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  .donate-qr.zoomed{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(2.8);z-index:1000005;
    box-shadow:0 0 0 4px rgba(45,212,191,.6),0 20px 60px rgba(0,0,0,.8);cursor:zoom-out}
  .donate-qr-hint{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;
    background:linear-gradient(135deg,#2dd4bf,#3b8cff);color:#06120f;display:grid;place-items:center;
    font-size:14px;font-weight:800;box-shadow:0 2px 8px rgba(45,212,191,.4);pointer-events:none;
    opacity:0;transition:opacity .2s}
  .donate-qr-wrap:hover .donate-qr-hint{opacity:1}
  .donate-qr.zoomed ~ .donate-qr-hint{display:none}
  .donate-net{font-weight:800;font-size:15px;letter-spacing:.3px;color:var(--txt)}
  .donate-badge{font-size:10px;font-weight:800;letter-spacing:.5px;color:#06120f;
    background:linear-gradient(135deg,#2dd4bf,#3b8cff);border-radius:20px;padding:3px 9px}
  .donate-chain{font-size:10px;color:var(--mut);font-family:ui-monospace,monospace;letter-spacing:.4px}
  .donate-addr-lbl{font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);margin-top:2px}
  .donate-addr{font-family:ui-monospace,monospace;font-size:11.5px;line-height:1.5;color:var(--txt);
    background:rgba(12,14,18,.6);border:1px solid var(--line);border-radius:9px;padding:9px 11px;
    word-break:break-all;cursor:pointer;transition:.15s;user-select:all}
  .donate-addr:hover{border-color:var(--teal);color:var(--teal);box-shadow:0 0 0 3px rgba(45,212,191,.12)}
  .donate-copy{align-self:flex-start;font-family:inherit;font-weight:700;font-size:12px;color:var(--txt);cursor:pointer;
    background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 15px;transition:.15s}
  .donate-copy:hover{border-color:var(--teal);color:var(--teal);transform:translateY(-1px)}
  .donate-copy.ok{background:var(--green);color:#06120f;border-color:var(--green);transform:none}
  .donate-qr-wrap{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px}
  .donate-qr{width:124px;height:124px;border-radius:12px;border:1px solid var(--line);background:#141519;padding:6px;display:block}
  .donate-qr-cap{font-size:9px;color:var(--mut);letter-spacing:.5px;text-transform:uppercase}
  .donate-note{margin-top:24px;text-align:center;font-size:12.5px;color:var(--mut)}
  .donate-note b{color:var(--teal)}
  @media(max-width:560px){
    header{flex-wrap:wrap;justify-content:center;gap:12px;padding-top:18px}
    .logo{width:100%;text-align:center}
    .h-right{width:100%;justify-content:center;gap:8px}
    .gh{padding:7px 10px}
    .hero{padding-top:34px}
    .install{padding:28px 16px}
    .bm-btn{font-size:18px;padding:17px 26px}
    .shots,.donate-grid{grid-template-columns:minmax(0,1fr)}
    .donate-card{flex-direction:column}
    .donate-qr{width:148px;height:148px}
    .donate-qr-wrap{align-self:center}
  }

  footer{position:relative;z-index:1;border-top:1px solid var(--line);margin-top:70px;padding:28px 0;
    text-align:center;color:var(--mut);font-size:13px}
  footer a{color:var(--teal);text-decoration:none;font-weight:700}
  footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>

<div class="wrap">
  <header>
    <div class="logo">ParserAccs</div>
    <div class="h-right">
      <div id="langsw" class="langsw" role="switch" aria-label="Language">
        <span class="knob"></span>
        <span class="opt" data-lang="ru">RU</span>
        <span class="opt" data-lang="en">EN</span>
      </div>
      <a class="gh" href="#donate" title="Support">
        <span>☕</span> <span data-i18n="donate_nav"></span>
      </a>
      <a class="gh" href="https://github.com/Kw3nty/ParserAccs" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub
      </a>
    </div>
  </header>

  <div class="hero">
    <h1>ParserAccs</h1>
    <p class="lead" data-i18n="lead"></p>
    <div class="tags">
      <span class="tag" data-i18n="tag1"></span>
      <span class="tag" data-i18n="tag2"></span>
      <span class="tag" data-i18n="tag3"></span>
      <span class="tag" data-i18n="tag4"></span>
      <span class="tag" data-i18n="tag5"></span>
      <span class="tag" data-i18n="tag6"></span>
    </div>
  </div>

  <div class="install">
    <div class="hint-bar" data-i18n-html="hint"></div>

    <a id="bm-link" class="bm-btn loading" href="javascript:void(0)" title="Drag me to your bookmarks bar">⏳ …</a>

    <div class="drag-hint"><span class="arrow">↑</span> <span data-i18n="drag"></span></div>
    <div class="lang-note" data-i18n-html="langnote"></div>

    <div class="actions">
      <button id="bm-copy" class="copy-btn" data-i18n="copybtn"></button>
    </div>
    <div class="actions" style="margin-top:10px;gap:14px">
      <button id="bm-rebuild" class="rebuild-btn">🔁 Пересобрать</button>
      <span id="build-status" class="loading">⏳ Инициализация…</span>
      <span id="build-version"></span>
    </div>

    <div id="warn" class="warn" data-i18n-html="warn"></div>
  </div>

  <section class="block">
    <h2 class="sec-title" data-i18n="how_t"></h2>
    <p class="sec-sub" data-i18n="how_s"></p>
    <div class="steps">
      <div class="step"><span class="n">1</span><h3 data-i18n="s1t"></h3><p data-i18n-html="s1p"></p></div>
      <div class="step"><span class="n">2</span><h3 data-i18n="s2t"></h3><p data-i18n-html="s2p"></p></div>
      <div class="step"><span class="n">3</span><h3 data-i18n="s3t"></h3><p data-i18n-html="s3p"></p></div>
    </div>
  </section>

  <section class="block">
    <h2 class="sec-title" data-i18n="feat_t"></h2>
    <div class="feats">
      <div class="feat"><div class="ic">📊</div><h3 data-i18n="f1t"></h3><p data-i18n="f1p"></p></div>
      <div class="feat"><div class="ic">📅</div><h3 data-i18n="f2t"></h3><p data-i18n="f2p"></p></div>
      <div class="feat"><div class="ic">🔍</div><h3 data-i18n="f3t"></h3><p data-i18n="f3p"></p></div>
      <div class="feat"><div class="ic">☑️</div><h3 data-i18n="f4t"></h3><p data-i18n="f4p"></p></div>
      <div class="feat"><div class="ic">📄</div><h3 data-i18n="f5t"></h3><p data-i18n="f5p"></p></div>
      <div class="feat"><div class="ic">🔒</div><h3 data-i18n="f6t"></h3><p data-i18n="f6p"></p></div>
      <div class="feat rules"><div class="ic">🔁</div><h3 data-i18n="f7t"></h3><p data-i18n="f7p"></p></div>
      <div class="feat rules"><div class="ic">💱</div><h3 data-i18n="f8t"></h3><p data-i18n="f8p"></p></div>
      <div class="feat clone"><div class="ic">🧬</div><h3 data-i18n="f9t"></h3><p data-i18n="f9p"></p></div>
    </div>
  </section>

  <section class="block">
    <h2 class="sec-title" data-i18n="rules_t"></h2>

function detectLang(){
  try{var s=localStorage.getItem('pa_site_lang');if(s==='ru'||s==='en')return s;}catch(e){}
  var nl=(navigator.language||navigator.userLanguage||'').toLowerCase();
  return nl.indexOf('ru')===0?'ru':'en';
}
var siteLang=detectLang();

function applyLanguage(lang,animate){
  siteLang=lang;
  try{localStorage.setItem('pa_site_lang',lang);}catch(e){}
  document.documentElement.lang=lang;
  var sw=document.getElementById('langsw');
  if(sw){sw.classList.toggle('en',lang==='en');sw.querySelectorAll('.opt').forEach(function(o){o.classList.toggle('on',o.getAttribute('data-lang')===lang);});}
  var nodes=document.querySelectorAll('[data-i18n],[data-i18n-html]');
  var paint=function(){
    nodes.forEach(function(el){
      var k=el.getAttribute('data-i18n')||el.getAttribute('data-i18n-html');
      var v=(D[lang]&&D[lang][k]!=null)?D[lang][k]:(D.ru[k]!=null?D.ru[k]:'');
      if(el.hasAttribute('data-i18n-html'))el.innerHTML=v;else el.textContent=v;
    });
    if(window.__pa_code_ru){
      var code=(lang==='en')?window.__pa_code_en:window.__pa_code_ru;
      window.__pa_cur_code=code;
      var link=document.getElementById('bm-link');
      if(link&&!link.classList.contains('loading'))link.href=code;
    }
    if(animate)nodes.forEach(function(el){el.classList.remove('i18n-fade');});
  };
  if(animate){nodes.forEach(function(el){el.classList.add('i18n-fade');});setTimeout(paint,180);}
  else paint();
}

document.getElementById('langsw').addEventListener('click',function(){
  applyLanguage(siteLang==='ru'?'en':'ru',true);
});

/* ===== донат: копирование адреса ===== */
try{(function(){
  function feedback(card){
    var b=card.querySelector('.donate-copy');if(!b)return;
    var o=b.getAttribute('data-o');if(o==null){o=b.textContent;b.setAttribute('data-o',o);}
    b.classList.add('ok');b.textContent=(siteLang==='en'?'✓ Copied':'✓ Скопировано');
    clearTimeout(b._t);b._t=setTimeout(function(){b.classList.remove('ok');b.textContent=b.getAttribute('data-o');},1600);
  }
  function legacy(addr,card){
    var ta=document.createElement('textarea');ta.value=addr;ta.style.position='fixed';ta.style.top='-1000px';ta.style.opacity='0';
    document.body.appendChild(ta);ta.focus();ta.select();
    try{document.execCommand('copy');feedback(card);}catch(e){}
    ta.remove();
  }
  function doCopy(addr,card){
    if(!addr)return;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(addr).then(function(){feedback(card);}).catch(function(){legacy(addr,card);});
    }else legacy(addr,card);
  }
  document.querySelectorAll('.donate-card').forEach(function(card){
    var addr=card.getAttribute('data-addr')||'';
    var a=card.querySelector('.donate-addr');
    var b=card.querySelector('.donate-copy');
    if(a)a.addEventListener('click',function(){doCopy(addr,card);});
    if(b)b.addEventListener('click',function(){doCopy(addr,card);});
  });
})();}catch(e){}

  fetch(PA_META_URL+'?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(meta){
    if(!meta||!meta.bookmarkletHref)throw new Error('tool-meta.json без bookmarkletHref');
    window.__pa_code_ru=meta.bookmarkletHref;window.__pa_code_en=meta.bookmarkletHrefEn||meta.bookmarkletHref;
    window.__pa_cur_code=siteLang==='en'?window.__pa_code_en:window.__pa_code_ru;
    link.href=window.__pa_cur_code;link.classList.remove('loading');link.textContent='📌 ParserAccs';
    link.title=siteLang==='en'?'Drag me to your bookmarks bar':'Перетащи меня на панель закладок';link.style.filter='';
    if(status){status.className='ready';status.textContent=siteLang==='en'?'✓ Loader ready':'✓ Loader готов';}
    if(version)version.textContent='build · '+(meta.build||'?')+' · loader';
    if(drag)drag.style.display='flex';if(warn)warn.style.display='none';if(copy)copy.disabled=false;if(rebuild)rebuild.disabled=false;
    if(typeof applyLanguage==='function')applyLanguage(siteLang,false);
  }).catch(function(e){
    link.classList.remove('loading');link.textContent='⚠ ParserAccs';
    if(status){status.className='err';status.textContent=(siteLang==='en'?'✗ Could not load loader: ':'✗ Не удалось загрузить loader: ')+e.message+' — fbads.fun';}
    if(rebuild)rebuild.disabled=false;
  });
}

/* ===== инициализация ===== */
try{(function(){
  var link=document.getElementById('bm-link'),
      copy=document.getElementById('bm-copy'),
      rebuild=document.getElementById('bm-rebuild');

  link.addEventListener('click',function(e){e.preventDefault();});

  if(rebuild){
    rebuild.textContent=(siteLang==='en'?'🔁 Rebuild':'🔁 Пересобрать');
    rebuild.addEventListener('click',function(){buildBookmarklet();});
  }

  if(copy){
    copy.addEventListener('click',function(){
      var code=window.__pa_cur_code;
      if(!code){document.getElementById('warn').style.display='block';return;}
      var btn=this,done=function(){btn.classList.add('ok');var o=btn.textContent;btn.textContent=(siteLang==='en'?'✓ Copied':'✓ Скопировано');setTimeout(function(){btn.classList.remove('ok');btn.textContent=D[siteLang].copybtn;},1600);};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done).catch(fallback);}
      else fallback();
      function fallback(){var ta=document.createElement('textarea');ta.value=code;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();}
    });
  }

  /* АВТО-сборка при загрузке */
  buildBookmarklet();
})();}catch(e){}

/* ===== QR zoom: клик для увеличения ===== */
try{(function(){
  document.querySelectorAll('.donate-qr').forEach(function(img){
    img.addEventListener('click',function(e){
      e.stopPropagation();
      var zoomed=this.classList.contains('zoomed');
      document.querySelectorAll('.donate-qr.zoomed').forEach(function(q){q.classList.remove('zoomed');});
      if(!zoomed)this.classList.add('zoomed');
    });
  });
  document.addEventListener('click',function(e){
    if(!e.target.classList.contains('donate-qr')){
      document.querySelectorAll('.donate-qr.zoomed').forEach(function(q){q.classList.remove('zoomed');});
    }
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){document.querySelectorAll('.donate-qr.zoomed').forEach(function(q){q.classList.remove('zoomed');});}
  });
})();}catch(e){}

/* ===== QR lightbox: клик — большое окно ===== */
try{(function(){
  function paOpenQr(src,alt){
    var old=document.querySelector('.pa-qr-lb');if(old)old.remove();
    var ov=document.createElement('div');ov.className='pa-qr-lb';
    var im=document.createElement('img');im.src=src;im.alt=alt||'QR';
    ov.appendChild(im);
    ov.addEventListener('click',function(){ov.remove();});
    var h=function(e){if(e.key==='Escape'){ov.remove();document.removeEventListener('keydown',h);}};
    document.addEventListener('keydown',h);
    document.body.appendChild(ov);
  }
  document.querySelectorAll('.donate-qr').forEach(function(img){
    img.addEventListener('click',function(e){e.stopPropagation();paOpenQr(img.currentSrc||img.src,img.alt);});
  });
  document.querySelectorAll('.shot a').forEach(function(a){
    a.addEventListener('click',function(e){e.preventDefault();var im=a.querySelector('img');paOpenQr(a.href,im&&im.alt);var lb=document.querySelector('.pa-qr-lb');if(lb)lb.classList.add('pa-shot-lb');});
  });
})();}catch(e){}

applyLanguage(siteLang,false);
</script>
</body>
