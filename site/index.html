<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ParserAccs — все рекламные кабинеты в одной закладке</title>
<meta name="description" content="Букмарклет для Facebook Ads Manager: сводка по кабинетам, CSV, перенос автоправил и клонирование кампаний.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0E1116">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1116;--ink-2:#12161C;--surface:#171C24;--raised:#1E242E;--line:#2A313D;--line-soft:#212732;
  --text:#E8EAEF;--muted:#A3ABB9;--faint:#7F8898;
  --blue:#2DD4BF;--blue-ink:#04211D;--blue2:#3B8CFF;--violet:#A78BFA;--green:#3DDC97;--amber:#F2B33D;--red:#FF6B7A;
  --display:'Unbounded',system-ui,sans-serif;--body:'Onest',system-ui,sans-serif;
  --r-lg:20px;--r-md:14px;--r-sm:10px;
  --shadow:0 18px 50px -18px rgba(3,8,18,.75),0 4px 14px -6px rgba(3,8,18,.6);
}
*{box-sizing:border-box}
#bg-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap,footer{position:relative;z-index:1}
html{scroll-behavior:smooth;background:var(--ink);color-scheme:dark}
body{margin:0;font:400 16px/1.6 var(--body);color:var(--text);background:
  radial-gradient(1100px 560px at 10% -12%,rgba(45,212,191,.10),transparent 60%),
  radial-gradient(900px 500px at 100% 25%,rgba(59,140,255,.06),transparent 60%),var(--ink);
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
::selection{background:rgba(45,212,191,.32);color:#fff}
a{color:var(--blue);text-underline-offset:3px}
a:hover{color:#5EEAD4}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid var(--ink)}::-webkit-scrollbar-track{background:var(--ink)}
kbd{font:600 .82em var(--body);padding:2px 7px;border-radius:6px;background:var(--raised);border:1px solid var(--line);border-bottom-width:2px;color:var(--text)}
code{font-size:.9em;background:var(--raised);padding:1px 6px;border-radius:5px}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
.i18n-fade{opacity:0;transition:opacity .18s}
[data-i18n],[data-i18n-html]{transition:opacity .18s}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0}
.brand{font:600 19px var(--display);letter-spacing:-.01em;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:10px}
.brand svg{color:var(--blue)}
.nav{display:flex;align-items:center;gap:6px}
.nav a.lnk{color:var(--muted);text-decoration:none;font-weight:500;font-size:15px;padding:8px 12px;border-radius:10px}
.nav a.lnk:hover{color:var(--text);background:var(--surface)}
.langsw{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;cursor:pointer;user-select:none;margin-left:6px}
.langsw .knob{position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:calc(100% - 6px);background:var(--raised);border:1px solid var(--line);border-radius:999px;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.langsw.en .knob{transform:translateX(100%)}
.langsw .opt{position:relative;z-index:1;font-weight:600;font-size:13px;padding:5px 12px;color:var(--faint);text-align:center}
.langsw .opt.on{color:var(--text)}
.gh{display:inline-flex;align-items:center;gap:8px;color:var(--text)!important;text-decoration:none;font-weight:500;font-size:15px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;margin-left:6px}
.gh:hover{background:var(--surface)}

/* hero */
.hero{position:relative;padding:56px 0 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.hero h1{font:600 clamp(36px,5.6vw,68px)/1.04 var(--display);letter-spacing:-.035em;margin:0;max-width:15ch;text-wrap:balance}
.hero .lead{font-size:clamp(17px,1.6vw,20px);line-height:1.55;color:var(--muted);max-width:60ch;margin:22px 0 0}
.install{margin-top:40px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;position:relative}
.bm-zone{position:relative}
/* направляющая к панели закладок */
.guide{position:absolute;left:-34px;top:calc(-1 * var(--zt,300px));width:2px;height:calc(var(--zt,300px) + 31px);pointer-events:none}
.guide s{position:absolute;bottom:0;left:0;width:30px;height:2px;background:repeating-linear-gradient(to right,var(--blue) 0 6px,transparent 6px 12px);opacity:.85;animation:fade .3s .1s both}
.guide i{position:absolute;inset:0;background:repeating-linear-gradient(to top,var(--blue) 0 6px,transparent 6px 12px);transform-origin:bottom;animation:grow 1.1s .25s cubic-bezier(.16,1,.3,1) both;opacity:.85}
.guide b{position:absolute;top:-2px;left:-5px;width:12px;height:12px;border-left:2px solid var(--blue);border-top:2px solid var(--blue);transform:rotate(45deg);animation:fade .4s 1.2s both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.topbar-note{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--blue),rgba(45,212,191,.15) 40%,transparent);z-index:5;pointer-events:none;animation:fade .5s 1.2s both}
.bm-btn{display:inline-flex;align-items:center;gap:10px;font:600 18px var(--display);letter-spacing:-.01em;color:var(--blue-ink)!important;background:var(--blue);text-decoration:none;padding:18px 26px;border-radius:16px;cursor:grab;
  box-shadow:0 14px 34px -12px rgba(45,212,191,.6),inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .15s,box-shadow .15s}
.bm-btn:hover{transform:translateY(-2px);box-shadow:0 20px 40px -14px rgba(45,212,191,.7),inset 0 -3px 0 rgba(0,0,0,.18)}
.bm-btn:active{cursor:grabbing;transform:translateY(0)}
.bm-btn.loading{opacity:.65;cursor:progress}
.drag-hint{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--muted);max-width:52ch}
.drag-hint strong{color:var(--text);font-weight:600}
.drag-hint small{font-size:13px;color:var(--faint)}
.sub-actions{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;font-size:14px;color:var(--faint)}
.btn-ghost{font:500 15px var(--body);color:var(--text);background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.btn-ghost:hover:not(:disabled){background:var(--surface)}
.btn-ghost:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost.ok{border-color:var(--green);color:var(--green)}
.btn-link{font:500 14px var(--body);color:var(--faint);background:none;border:0;padding:4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.btn-link:hover{color:var(--text)}
#build-status{font-size:14px}#build-status.ready{color:var(--green)}#build-status.err{color:var(--red)}#build-status.loading{color:var(--faint)}
#build-version{font-size:13px;color:var(--faint)}
.lang-note{font-size:14px;color:var(--faint)}
.lang-note b{color:var(--muted)}
.warn{display:none;margin-top:16px;padding:14px 16px;border:1px solid rgba(242,179,61,.45);background:rgba(242,179,61,.08);color:#F8D58E;border-radius:var(--r-md);font-size:14px}

/* product shot */
.stage{position:relative;margin:30px 0 0}
.frame{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--ink-2);padding:0 0 0;box-shadow:0 40px 90px -30px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.02)}
.frame-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-soft);background:#11151B}
.addr{flex:1;max-width:460px;margin:0 auto;font-size:13px;color:var(--faint);background:var(--ink);border:1px solid var(--line-soft);border-radius:8px;padding:5px 12px;display:flex;align-items:center;gap:8px}
.bmarks{display:flex;gap:16px;padding:7px 16px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line-soft);background:#11151B}
.bmarks span{display:inline-flex;align-items:center;gap:6px}
.bmarks .mine{color:var(--text);background:rgba(45,212,191,.14);border:1px solid rgba(45,212,191,.42);padding:1px 9px;border-radius:6px}
.frame .shot{padding:18px;background:linear-gradient(180deg,#0F1318,#0C0F13)}
.frame img{display:block;width:100%;height:auto}
.stage .shot a{display:block;cursor:zoom-in}

/* sections */
section{padding:96px 0 0}
.sec-h{font:600 clamp(28px,3.4vw,42px)/1.1 var(--display);letter-spacing:-.03em;margin:0 0 14px;text-wrap:balance}
.sec-p{color:var(--muted);font-size:18px;max-width:62ch;margin:0}

/* steps: настоящая последовательность */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:44px;counter-reset:s;border-top:1px solid var(--line)}
.step{position:relative;padding:28px 28px 0 0}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:-17px;left:0;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 14px var(--display);background:var(--ink);border:1px solid var(--line);color:var(--blue)}
.step h3{font:600 19px/1.3 var(--body);margin:12px 0 8px}
.step p{margin:0;color:var(--muted);font-size:15.5px;max-width:34ch}

/* modules tabs */
.tabs{display:inline-flex;gap:4px;margin-top:36px;padding:4px;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;flex-wrap:wrap}
.tab{font:600 15px var(--body);color:var(--muted);background:none;border:0;padding:10px 16px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:9px}
.tab svg{opacity:.8}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:var(--raised);color:var(--text);box-shadow:0 2px 8px -2px rgba(0,0,0,.5)}
.tab .beta{font-size:11px;font-weight:600;color:var(--amber);border:1px solid rgba(242,179,61,.45);border-radius:6px;padding:0 6px;line-height:18px}
.panel{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:start;margin-top:36px}
.panel[hidden]{display:none}
.panel-text h3{font:600 24px/1.25 var(--display);letter-spacing:-.02em;margin:0 0 10px}
.panel-text>p{color:var(--muted);margin:0 0 22px}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:16px}
.facts li{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start}
.facts svg{color:var(--green);margin-top:3px}
.facts b{display:block;font-weight:600;color:var(--text)}
.facts span{color:var(--muted);font-size:15px}
.flow{list-style:none;margin:0;padding:0;counter-reset:f;display:grid;gap:18px}
.flow li{position:relative;padding-left:44px}
.flow li::before{counter-increment:f;content:counter(f);position:absolute;left:0;top:1px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--display);border:1px solid var(--line);color:var(--blue)}
.flow b{display:block;font-weight:600}
.flow span{color:var(--muted);font-size:15px}
.note{margin-top:22px;padding:14px 16px;border-radius:var(--r-md);background:rgba(242,179,61,.07);border:1px solid rgba(242,179,61,.35);color:#F3D9A4;font-size:14.5px}
.note b{color:var(--amber)}
.panel-media{display:grid;gap:14px}
.panel-media .shot a{display:block;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);cursor:zoom-in;transition:transform .2s}
.panel-media .shot a:hover{transform:translateY(-2px)}
.panel-media img{display:block;width:100%;height:auto}
.panel-media .zoom{aspect-ratio:2.07/1}
.panel-media .zoom img{width:167%;max-width:none;margin:-22.5% 0 0 0}
.cap{font-size:13.5px;color:var(--faint);margin-top:8px}

/* trust */
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;margin-top:40px}
.trust>div{display:grid;grid-template-columns:40px 1fr;gap:14px}
.trust .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--blue)}
.trust h3{font:600 17px/1.3 var(--body);margin:2px 0 6px}
.trust p{margin:0;color:var(--muted);font-size:15px}

/* donate */
.donate{margin-top:40px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.donate-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:22px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line)}
.donate-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.donate-ic{width:26px;height:26px}
.donate-badge{font-weight:700;font-size:15px}
.donate-chain{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.donate-addr-lbl{font-size:13px;color:var(--faint);margin-bottom:4px}
.donate-addr{font-size:14px;word-break:break-all;color:var(--text);cursor:copy;padding:9px 11px;border-radius:var(--r-sm);background:var(--ink-2);border:1px solid var(--line-soft)}
.donate-addr:hover{border-color:var(--line)}
.donate-copy{margin-top:12px}
.donate-copy.ok{border-color:var(--green);color:var(--green)}
.donate-qr-wrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.donate-qr{width:124px;height:124px;border-radius:14px;background:var(--ink-2);border:1px solid var(--line);padding:4px;cursor:zoom-in;transition:border-color .2s,transform .2s}
.donate-qr:hover{border-color:rgba(45,212,191,.6);transform:scale(1.03)}
.donate-qr-cap{font-size:12.5px;color:var(--faint)}
.donate-qr-hint{display:none}
.donate-note{color:var(--faint);font-size:14.5px;margin-top:18px}

footer{margin-top:110px;padding:30px 0 40px;border-top:1px solid var(--line-soft);color:var(--faint);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}

/* lightbox (общий с QR) */
.pa-qr-lb{position:fixed;inset:0;z-index:1000;background:rgba(7,11,19,.86);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;cursor:zoom-out;animation:fade .18s ease}
.pa-qr-lb img{width:min(78vmin,520px);height:auto;border-radius:22px;background:var(--ink-2);border:1px solid var(--line);box-shadow:0 24px 80px rgba(0,0,0,.7)}
.pa-qr-lb.pa-shot-lb img{width:auto;max-width:94vw;max-height:90vh;border-radius:12px;background:none}

@media (max-width:900px){
  .nav a.lnk{display:none}
  .panel{grid-template-columns:minmax(0,1fr);gap:28px}
  .trust,.donate{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:minmax(0,1fr);border-top:0;gap:30px}
  .step{padding:0 0 0 48px}.step::before{top:0}
  .step h3{margin-top:2px}
}
@media (max-width:1250px){.guide{display:none}}
@media (max-width:560px){
  .wrap{padding:0 18px}
  .donate-card{grid-template-columns:minmax(0,1fr)}
  .bmarks span:not(.mine){display:none}
  .gh-t{display:none}
  .gh{padding:8px 10px}
  .brand{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="bg-canvas" aria-hidden="true"></canvas>
<div class="topbar-note" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#top" id="top" aria-label="ParserAccs">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      ParserAccs
    </a>
    <nav class="nav">
      <a class="lnk" href="#install" data-i18n="nav_install"></a>
      <a class="lnk" href="#modules" data-i18n="nav_modules"></a>
      <a class="lnk" href="#donate" data-i18n="donate_nav"></a>
      <div id="langsw" class="langsw" role="switch" aria-label="Language" tabindex="0">
        <span class="knob"></span><span class="opt" data-lang="ru">RU</span><span class="opt" data-lang="en">EN</span>
      </div>
      <a class="gh" href="https://github.com/KwentyInc/ParserAccs" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        <span class="gh-t">GitHub</span>
      </a>
    </nav>
  </header>

  <div class="hero">
    <h1 data-i18n="hero_h"></h1>
    <p class="lead" data-i18n="lead"></p>

    <div class="install">
      <div class="bm-zone">
        <span class="guide" aria-hidden="true"><i></i><b></b><s></s></span>
        <a id="bm-link" class="bm-btn loading" href="javascript:void(0)" title="Drag me to your bookmarks bar">⏳ …</a>
      </div>
      <div class="drag-hint"><strong data-i18n="drag"></strong><small data-i18n-html="hint"></small></div>
      <div class="sub-actions">
        <button id="bm-copy" class="btn-ghost" data-i18n="copybtn"></button>
        <span class="lang-note" data-i18n-html="langnote"></span>
      </div>
      <div class="sub-actions">
        <span id="build-status" class="loading"></span>
        <span id="build-version"></span>
        <button id="bm-rebuild" class="btn-link"></button>
      </div>
    </div>
    <div id="warn" class="warn" data-i18n-html="warn"></div>

    <div class="stage">
      <div class="frame">
        <div class="frame-bar"><div class="addr"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>adsmanager.facebook.com</div></div>
        <div class="bmarks"><span>Ads Manager</span><span>Business Suite</span><span class="mine">📌 ParserAccs</span><span>Events Manager</span></div>
        <div class="shot"><a href="docs/screenshots/accounts.svg"><img src="docs/screenshots/accounts.svg" alt="ParserAccs: таблица кабинетов" width="1452" height="792"></a></div>
      </div>
    </div>
  </div>

  <section id="install">
    <h2 class="sec-h" data-i18n="how_t"></h2>
    <p class="sec-p" data-i18n="how_s"></p>
    <div class="steps">
      <div class="step"><h3 data-i18n="s1t"></h3><p data-i18n-html="s1p"></p></div>
      <div class="step"><h3 data-i18n="s2t"></h3><p data-i18n-html="s2p"></p></div>
      <div class="step"><h3 data-i18n="s3t"></h3><p data-i18n-html="s3p"></p></div>
    </div>
  </section>

  <section id="modules">
    <h2 class="sec-h" data-i18n="feat_t"></h2>
    <p class="sec-p" data-i18n="feat_s"></p>
    <div class="tabs" role="tablist">

/* ===== язык: дефолт = память || язык браузера (НЕ ip — прокси ломают ip) ===== */
function detectLang(){
  try{var s=localStorage.getItem('pa_site_lang');if(s==='ru'||s==='en')return s;}catch(e){}
  var nl=(navigator.language||navigator.userLanguage||'').toLowerCase();
  return nl.indexOf('ru')===0?'ru':'en';
}
var siteLang=detectLang();

function applyLanguage(lang,animate){
  siteLang=lang;
  try{localStorage.setItem('pa_site_lang',lang);}catch(e){}
  document.documentElement.lang=lang;
  var sw=document.getElementById('langsw');
  if(sw){sw.classList.toggle('en',lang==='en');sw.querySelectorAll('.opt').forEach(function(o){o.classList.toggle('on',o.getAttribute('data-lang')===lang);});}
  var nodes=document.querySelectorAll('[data-i18n],[data-i18n-html]');
  var paint=function(){
    nodes.forEach(function(el){
      var k=el.getAttribute('data-i18n')||el.getAttribute('data-i18n-html');
      var v=(D[lang]&&D[lang][k]!=null)?D[lang][k]:(D.ru[k]!=null?D.ru[k]:'');
      if(el.hasAttribute('data-i18n-html'))el.innerHTML=v;else el.textContent=v;
    });
    if(window.__pa_code_ru){
      var code=(lang==='en')?window.__pa_code_en:window.__pa_code_ru;
      window.__pa_cur_code=code;
      var link=document.getElementById('bm-link');
      if(link&&!link.classList.contains('loading'))link.href=code;
    }
    if(animate)nodes.forEach(function(el){el.classList.remove('i18n-fade');});
  };
  if(animate){nodes.forEach(function(el){el.classList.add('i18n-fade');});setTimeout(paint,180);}
  else paint();
}

document.getElementById('langsw').addEventListener('click',function(){
  applyLanguage(siteLang==='ru'?'en':'ru',true);
});

/* ===== донат: копирование адреса ===== */
try{(function(){
  function feedback(card){
    var b=card.querySelector('.donate-copy');if(!b)return;
    var o=b.getAttribute('data-o');if(o==null){o=b.textContent;b.setAttribute('data-o',o);}
    b.classList.add('ok');b.textContent=(siteLang==='en'?'✓ Copied':'✓ Скопировано');
    clearTimeout(b._t);b._t=setTimeout(function(){b.classList.remove('ok');b.textContent=b.getAttribute('data-o');},1600);
  }
  function legacy(addr,card){
    var ta=document.createElement('textarea');ta.value=addr;ta.style.position='fixed';ta.style.top='-1000px';ta.style.opacity='0';
    document.body.appendChild(ta);ta.focus();ta.select();
    try{document.execCommand('copy');feedback(card);}catch(e){}
    ta.remove();
  }
  function doCopy(addr,card){
    if(!addr)return;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(addr).then(function(){feedback(card);}).catch(function(){legacy(addr,card);});
    }else legacy(addr,card);
  }
  document.querySelectorAll('.donate-card').forEach(function(card){
    var addr=card.getAttribute('data-addr')||'';
    var a=card.querySelector('.donate-addr');
    var b=card.querySelector('.donate-copy');
    if(a)a.addEventListener('click',function(){doCopy(addr,card);});
    if(b)b.addEventListener('click',function(){doCopy(addr,card);});
  });
})();}catch(e){}

/* ===== ГИБРИДНАЯ СБОРКА букмарклета из модулей src/ ===== */
/* Копия лендинга вне fbads.fun (например GitHub Pages) берёт тот же self-updating loader,
   что и продакшн: из https://fbads.fun/parseraccs/latest/tool-meta.json. Никакой сборки из src/ через CDN.
   На fbads.fun этот блок заменяется scripts/package-release.cjs. */
var PA_META_URL='https://fbads.fun/parseraccs/latest/tool-meta.json';
function buildBookmarklet(){
  var link=document.getElementById('bm-link'),copy=document.getElementById('bm-copy'),warn=document.getElementById('warn'),drag=document.querySelector('.drag-hint'),status=document.getElementById('build-status'),version=document.getElementById('build-version'),rebuild=document.getElementById('bm-rebuild');
  link.classList.add('loading');link.href='javascript:void(0)';link.textContent='⏳ …';
  if(status){status.className='loading';status.textContent=siteLang==='en'?'⏳ Loading loader…':'⏳ Загружаю loader…';}
  if(copy)copy.disabled=true;if(rebuild)rebuild.disabled=true;
  fetch(PA_META_URL+'?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(meta){
    if(!meta||!meta.bookmarkletHref)throw new Error('tool-meta.json без bookmarkletHref');
    window.__pa_code_ru=meta.bookmarkletHref;window.__pa_code_en=meta.bookmarkletHrefEn||meta.bookmarkletHref;
    window.__pa_cur_code=siteLang==='en'?window.__pa_code_en:window.__pa_code_ru;
    link.href=window.__pa_cur_code;link.classList.remove('loading');link.textContent='📌 ParserAccs';
    link.title=siteLang==='en'?'Drag me to your bookmarks bar':'Перетащи меня на панель закладок';link.style.filter='';
    if(status){status.className='ready';status.textContent=siteLang==='en'?'✓ Loader ready':'✓ Loader готов';}
    if(version)version.textContent='build · '+(meta.build||'?')+' · loader';
    if(drag)drag.style.display='flex';if(warn)warn.style.display='none';if(copy)copy.disabled=false;if(rebuild)rebuild.disabled=false;
    if(typeof applyLanguage==='function')applyLanguage(siteLang,false);
  }).catch(function(e){
    link.classList.remove('loading');link.textContent='⚠ ParserAccs';
    if(status){status.className='err';status.textContent=(siteLang==='en'?'✗ Could not load loader: ':'✗ Не удалось загрузить loader: ')+e.message+' — fbads.fun';}
    if(rebuild)rebuild.disabled=false;
  });
}

/* ===== инициализация ===== */
try{(function(){
  var link=document.getElementById('bm-link'),
      copy=document.getElementById('bm-copy'),
      rebuild=document.getElementById('bm-rebuild');

  link.addEventListener('click',function(e){e.preventDefault();});

  if(rebuild){
    rebuild.textContent=(siteLang==='en'?'Rebuild':'Пересобрать');
    rebuild.addEventListener('click',function(){buildBookmarklet();});
  }

  if(copy){
    copy.addEventListener('click',function(){
      var code=window.__pa_cur_code;
      if(!code){document.getElementById('warn').style.display='block';return;}
      var btn=this,done=function(){btn.classList.add('ok');var o=btn.textContent;btn.textContent=(siteLang==='en'?'✓ Copied':'✓ Скопировано');setTimeout(function(){btn.classList.remove('ok');btn.textContent=D[siteLang].copybtn;},1600);};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(code).then(done).catch(fallback);}
      else fallback();
      function fallback(){var ta=document.createElement('textarea');ta.value=code;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){}ta.remove();}
    });
  }

  /* АВТО-сборка при загрузке */
  buildBookmarklet();
})();}catch(e){}

/* ===== QR zoom: клик для увеличения ===== */
try{(function(){
  document.querySelectorAll('.donate-qr').forEach(function(img){
    img.addEventListener('click',function(e){
      e.stopPropagation();
      var zoomed=this.classList.contains('zoomed');
      document.querySelectorAll('.donate-qr.zoomed').forEach(function(q){q.classList.remove('zoomed');});
      if(!zoomed)this.classList.add('zoomed');
    });
  });
  document.addEventListener('click',function(e){
    if(!e.target.classList.contains('donate-qr')){
      document.querySelectorAll('.donate-qr.zoomed').forEach(function(q){q.classList.remove('zoomed');});
    }
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){document.querySelectorAll('.donate-qr.zoomed').forEach(function(q){q.classList.remove('zoomed');});}
  });
})();}catch(e){}

/* ===== QR lightbox: клик — большое окно ===== */
try{(function(){
  function paOpenQr(src,alt){
    var old=document.querySelector('.pa-qr-lb');if(old)old.remove();
    var ov=document.createElement('div');ov.className='pa-qr-lb';
    var im=document.createElement('img');im.src=src;im.alt=alt||'QR';
    ov.appendChild(im);
    ov.addEventListener('click',function(){ov.remove();});
    var h=function(e){if(e.key==='Escape'){ov.remove();document.removeEventListener('keydown',h);}};
    document.addEventListener('keydown',h);
    document.body.appendChild(ov);
  }
  document.querySelectorAll('.donate-qr').forEach(function(img){
    img.addEventListener('click',function(e){e.stopPropagation();paOpenQr(img.currentSrc||img.src,img.alt);});
  });
  document.querySelectorAll('.shot a').forEach(function(a){
    a.addEventListener('click',function(e){e.preventDefault();var im=a.querySelector('img');paOpenQr(a.href,im&&im.alt);var lb=document.querySelector('.pa-qr-lb');if(lb)lb.classList.add('pa-shot-lb');});
  });
})();}catch(e){}

/* ===== вкладки модулей ===== */
try{(function(){
  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  function sel(t,focus){tabs.forEach(function(x){var on=x===t;x.setAttribute('aria-selected',on?'true':'false');x.tabIndex=on?0:-1;document.getElementById(x.getAttribute('aria-controls')).hidden=!on;});if(focus)t.focus();}
  tabs.forEach(function(t,i){t.addEventListener('click',function(){sel(t);});t.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();sel(tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length],true);}});});
})();}catch(e){}
/* ===== направляющая от кнопки к панели закладок ===== */
try{(function(){
  var z=document.querySelector('.bm-zone');if(!z)return;
  function fit(){z.style.setProperty('--zt',Math.max(0,z.getBoundingClientRect().top+scrollY-14)+'px');}
  fit();addEventListener('resize',fit);addEventListener('load',fit);if(document.fonts)document.fonts.ready.then(fit);
})();}catch(e){}

try{document.getElementById('langsw').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();this.click();}});}catch(e){}

applyLanguage(siteLang,false);
